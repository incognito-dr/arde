<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="casi.">
<meta name="theme-color" content="#000000">
<title>ARDE</title>
<link rel="icon" href="data:image/svg+xml;utf8,{{FAVICON}}">
<style>
@font-face{font-family:Termina;src:url(data:font/otf;base64,{{F_TERM}}) format("opentype");font-display:swap}
:root{--red:#EC0529;--edge:clamp(24px,3.2vw,56px);--rail:clamp(78px,10.2vh,108px)}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#000;color:var(--red);overflow:hidden;-webkit-font-smoothing:antialiased}
body{font:400 12px/1.3 Termina,Arial,sans-serif}
.shell{height:100%;height:100svh;display:grid;grid-template-rows:calc(var(--rail) + env(safe-area-inset-top)) minmax(0,1fr) calc(var(--rail) + env(safe-area-inset-bottom))}
.header,.footer{display:flex;align-items:center;justify-content:space-between;padding-left:max(var(--edge),env(safe-area-inset-left));padding-right:max(var(--edge),env(safe-area-inset-right));position:relative;z-index:2}
.header{padding-top:env(safe-area-inset-top)}
.footer{padding-bottom:env(safe-area-inset-bottom)}
.wordmark{width:clamp(76px,6.1vw,108px);line-height:0}
.wordmark svg{display:block}
.instagram{display:inline-flex;align-items:center;min-height:44px;color:inherit;text-decoration:none;font-size:clamp(10px,.83vw,13px);letter-spacing:.015em;transition:color .2s ease}
.instagram:hover{color:#fff}
.instagram:focus-visible{outline:1px solid var(--red);outline-offset:7px}
.stage{position:relative;min-height:0;overflow:hidden;isolation:isolate}
.stage picture,.stage img,.stage video{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:contain}
.stage img,.stage video{object-position:50% 50%}
.stage video{opacity:0;transition:opacity .45s ease}
.stage.playing video{opacity:1}
.state{margin:0;font-size:clamp(23px,2vw,34px);font-weight:400;line-height:1;letter-spacing:-.035em}
.clock{font-size:clamp(10px,.83vw,13px);font-variant-numeric:tabular-nums;white-space:nowrap}
.progress{position:fixed;left:0;bottom:0;width:100%;height:2px;z-index:3;pointer-events:none}
.line{position:absolute;left:0;bottom:0;width:0;height:2px;background:var(--red)}
.line:after{content:"";position:absolute;top:0;left:var(--gx,0);width:var(--gw,0);height:100%;background:var(--red);opacity:0}
.line.gl{animation:glitch .32s steps(1) forwards}
.line.gl:after{animation:ghost .32s steps(1) forwards}
@keyframes glitch{0%{transform:translateX(-14px);height:4px;opacity:.9}20%{transform:translate(9px,-3px);height:2px;opacity:.35}40%{transform:translate(-5px,2px);height:6px;opacity:1}60%{transform:translateX(18px);height:1px;opacity:.6}80%{transform:translate(-2px,-1px);height:3px;opacity:1}100%{transform:none;height:2px;opacity:1}}
@keyframes ghost{0%{opacity:.8;transform:translateY(-7px)}25%{opacity:0}50%{opacity:.6;transform:translateY(-14px)}75%,100%{opacity:0}}
@media (orientation:portrait){:root{--edge:24px;--rail:80px}.wordmark{width:76px}.stage{margin:0 10px}.state{font-size:25px}}
@media (max-height:500px) and (orientation:landscape){:root{--rail:58px;--edge:24px}.wordmark{width:68px}.state{font-size:22px}}
</style>
</head>
<body>
<div class="shell">
  <header class="header">
    <div class="wordmark" role="img" aria-label="ARDE">{{WM}}</div>
    <a class="instagram" href="https://www.instagram.com/arde____________/" target="_blank" rel="noopener noreferrer" aria-label="ARDE en Instagram, abre en una nueva pestaña">@arde____________</a>
  </header>
  <main class="stage" id="stage" aria-label="ARDE, casi.">
    <picture aria-hidden="true">
      <source media="(orientation: portrait)" srcset="arde-mobile.jpg">
      <img src="arde-desktop.jpg" alt="" fetchpriority="high">
    </picture>
    <video id="artwork" muted autoplay loop playsinline preload="none" disablepictureinpicture aria-hidden="true" tabindex="-1"></video>
  </main>
  <footer class="footer">
    <h1 class="state">casi.</h1>
    <time class="clock" id="clock" aria-label="Hora de Santo Domingo"></time>
  </footer>
</div>
<div class="progress" aria-hidden="true"><div class="line" id="line"></div></div>
<script>
(function(){
  'use strict';
  var video=document.getElementById('artwork');
  var stage=document.getElementById('stage');
  var portrait=matchMedia('(orientation: portrait)');
  var activeFormat='';
  video.muted=true;
  video.defaultMuted=true;
  function play(){
    if(document.hidden)return;
    var attempt=video.play();
    if(attempt&&attempt.catch)attempt.catch(function(){});
  }
  function selectArtwork(){
    var format=portrait.matches?'mobile':'desktop';
    if(format===activeFormat)return;
    activeFormat=format;
    stage.classList.remove('playing');
    video.poster='arde-'+format+'.jpg';
    video.src='arde-'+format+'.mp4';
    video.load();
    play();
  }
  video.addEventListener('playing',function(){stage.classList.add('playing')});
  video.addEventListener('error',function(){stage.classList.remove('playing')});
  if(portrait.addEventListener)portrait.addEventListener('change',selectArtwork);
  else portrait.addListener(selectArtwork);
  document.addEventListener('visibilitychange',function(){
    if(document.hidden)video.pause();else play();
  });
  document.addEventListener('pointerdown',function(){if(video.paused)play()},{passive:true});
  selectArtwork();

  var clock=document.getElementById('clock');
  var formatter=new Intl.DateTimeFormat('en-US',{timeZone:'America/Santo_Domingo',hour:'2-digit',minute:'2-digit',hour12:true});
  function tick(){
    var now=new Date();
    clock.textContent=formatter.format(now).toLowerCase();
    clock.dateTime=now.toISOString();
  }
  tick();setInterval(tick,10000);

  var line=document.getElementById('line');
  var progress=0,elapsed=0,last=performance.now(),nextBack=6+Math.random()*5,nextGlitch=3+Math.random()*4;
  function glitch(){
    line.classList.remove('gl');
    void line.offsetWidth;
    line.style.setProperty('--gx',(Math.random()*80).toFixed(1)+'%');
    line.style.setProperty('--gw',(4+Math.random()*14).toFixed(1)+'%');
    line.classList.add('gl');
  }
  function frame(now){
    var dt=Math.min(.1,(now-last)/1000);last=now;
    if(!document.hidden){
      elapsed+=dt;
      progress+=(99-progress)*Math.min(1,dt*.045);
      if(elapsed>nextBack){progress=Math.max(4,progress-3-Math.random()*11);glitch();nextBack=elapsed+6+Math.random()*9}
      if(elapsed>nextGlitch){glitch();nextGlitch=elapsed+2.5+Math.random()*5}
      line.style.width=Math.min(99,progress).toFixed(2)+'%';
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
